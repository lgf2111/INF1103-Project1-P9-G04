# Runs automatically on GitHub whenever we push or open a pull request.
# It checks that the tests pass and that the app builds and runs in Docker.
name: CI

on: [push, pull_request]

jobs:
  # Job 0: check the code style with ruff (a fast Python linter).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check code style
        run: ruff check .

      # Hard constraint C1: no class definitions in team-authored Python.
      # Check every tracked Python file, including tests and root helpers.
      - name: Check for class definitions (must be none)
        run: |
          if git grep -nE '^[[:space:]]*class[[:space:]]+[A-Za-z_]' -- '*.py'; then
            echo "ERROR: class definitions are not allowed in team-authored Python."
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "ERROR: class check failed (git grep exit $status)."
              exit "$status"
            fi
          fi
          echo "OK: no class definitions found in tracked Python files."

  # Job 1: run the offline tests on plain Python.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  # Job 2: build the Docker image and run the tests inside it.
  # This proves the container works, which is part of the grade.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t phishreport .

      - name: Run the tests inside the container
        run: docker run --rm phishreport pytest
