# Runs automatically on GitHub whenever we push or open a pull request.
# It checks that the tests pass and that the app builds and runs in Docker.
name: CI

on: [push, pull_request]

jobs:
  # Job 0: check the code style with ruff (a fast Python linter).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check code style
        run: uvx ruff check .

  # Job 1: run the offline tests on plain Python.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requirements
        run: uv pip install --system -r requirements.txt

      - name: Show shared JSON and SQLite storage contracts
        run: >-
          python -m pytest -vv
          tests/core/test_data_core.py
          tests/core/test_sqlite_storage.py
          tests/core/test_storage_factory.py
          tests/core/test_storage_migration.py

      - name: Run offline tests
        run: python -m pytest

  # Job 2: build the Docker image and run the tests inside it.
  # This proves the container works, which is part of the grade.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t phishreport .

      - name: Build the Telegram image
        run: docker build --target telegram -t phishreport-telegram .

      - name: Check the Telegram data directory exists
        run: >-
          docker run --rm --network none --user 65534:65534 --workdir /tmp
          phishreport-telegram python -c "from pathlib import Path; assert Path('/data').is_dir()"

      - name: Run offline tests inside the Telegram image
        # Run unprivileged so the POSIX permission tests exercise real failures.
        # /tmp holds runtime writes; the image's PYTHONPATH=/app supplies imports.
        run: >-
          docker run --rm --network none --user 65534:65534 --workdir /tmp
          phishreport-telegram python -m pytest /app/tests -p no:cacheprovider
